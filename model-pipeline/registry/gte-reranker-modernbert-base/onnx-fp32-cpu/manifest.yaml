# BERT route (Starlings.Models.Bert): Alibaba-NLP/gte-reranker-modernbert-base on ONNX Runtime 1.30.0, fp32 on the CPU
# provider. Candidate contract: model-pipeline/candidates/gte-reranker-modernbert-base/profile.json (onboarding route
# bert-onnx-cpu-v1, recipes/gte-reranker-modernbert-base-cpu.yaml), admitted to the route for #101;
# BertModelProfile.BuiltIn("gte-reranker-modernbert-base") embeds the same file. Experimental, like the other BERT
# profiles. No admission record exists for the BERT route; the references are proposed, not adopted into protected/, and
# no gate has run.
schema_version: 1
id: gte-reranker-modernbert-base/onnx-fp32-cpu
# Experimental: development parity on the onboarding route only (proposed references, predeclared candidate policy); no gate ran.
maturity: experimental

origin:
  code:
    # Upstream ships the fp32 graph; the transformers built-in ModernBertForSequenceClassification is the reference, no
    # remote code. The graph is used as published, after comparison with that reference on the route's corpus.
    url: https://huggingface.co/Alibaba-NLP/gte-reranker-modernbert-base
    revision: "f7481e6055501a30fb19d090657df9ec1f79ab2c"
  weights:
    url: https://huggingface.co/Alibaba-NLP/gte-reranker-modernbert-base
    revision: "f7481e6055501a30fb19d090657df9ec1f79ab2c"
  files:
    # Alibaba-NLP/gte-reranker-modernbert-base at the pinned commit (candidates/gte-reranker-modernbert-base/profile.json,
    # origin.files).
    - path: README.md
      sha256: "02b4dbe7c93b7962270fa44ea8b294986265556ff7dd69492dd708d4a69e606e"
      size: 14180
    - path: config.json
      sha256: "c9316ff715158502dad782f35454eee18de984160618dc30afe7508feb46b7ce"
      size: 1333
    - path: model.safetensors
      sha256: "13c533d902d6a48fa97375c6856c3e60854f9228ea760e3fc18ebde057e0cf31"
      size: 598436708
    - path: onnx/model.onnx
      sha256: "c6d3226502addbcd4d2cf273802957ebf8a2a6bf94037dcb9b1d95bfc01e5d93"
      size: 598803940
    - path: special_tokens_map.json
      sha256: "ea97ecdbcc73713039d8d64dbb05e3689495c96657fbd9a18f5bed381be81049"
      size: 694
    - path: tokenizer.json
      sha256: "2aea6ff4701d063e7e029b6be695a1659f2caaa2ae4fb0e8b18285818271becd"
      size: 3583499
    - path: tokenizer_config.json
      sha256: "626c86908d7c711f93b0feffd8657b782cc2727b391f9be190240e8cafb626d5"
      size: 21031
  attribution: >-
    gte-reranker-modernbert-base by Tongyi Lab, Alibaba Group (Alibaba-NLP/gte-reranker-modernbert-base, Apache-2.0), on
    ModernBERT (answerdotai/ModernBERT-base, Apache-2.0). fp32 ONNX graph as published upstream.

rights:
  code_license: MIT OR Apache-2.0
  weights_license: Apache-2.0
  tokenizer_terms: Apache-2.0
  redistribution: download
  notes: >-
    Weights and tokenizer: Apache-2.0 (license: apache-2.0 in the model card front matter at
    f7481e6055501a30fb19d090657df9ec1f79ab2c; the repository has no LICENSE file). Starling reimplements the pipeline; no upstream
    source is copied. Nothing is bundled in the package: the application downloads the pinned files explicitly
    (ModelAssetStore.DownloadAsync(profile.RuntimeLock)) from the upstream repository, verified by size and SHA-256.

behavior:
  tasks: [reranking]
  # Including special tokens (BertModelProfile.MaxTokens). tokenizer_config.json model_max_length and the model card's
  # maximum input length; the 8000 in tokenizer.json is replaced at load (BertSession.ForProfile), as transformers
  # replaces it per call. Evidence covers pairs up to the corpus's longest row, not the limit.
  max_input_tokens: 8192
  offsets_unit: none
  # Longest-first truncation by the pinned tokenizer (candidate behavior.truncation longest_first): a single text loses its
  # right end; a pair shortens its longer side first.
  truncation: truncate-right
  defaults:
    score: raw logit of the single output (identity activation); not a calibrated probability
    pair_encoding: "[CLS] query [SEP] document [SEP], no segment ids"
    truncation: longest-first over the pair, special tokens included; the tokenizer.json truncation and Fixed padding of 8000 are not applied
    ranking: BertReranker.Rank orders by descending score, ties in input order
    batching: right padding with mask 0, maxBatchSize rows per call (default 32); maxBatchTokens and sortByLength opt-in (experimental)
    token_limit: the profile's 8192; BertReranker.Create maxTokens lowers it (experimental), so the model card's max_length=512 is maxTokens 512. Longer text is truncated, longer pre-tokenized rows are refused
    threads: two intra-op, one inter-op (Create threads argument)
  unsupported:
    - "GPU execution providers (CUDA, DirectML, CoreML)"
    - "fp16, bf16 and quantized graphs (the upstream onnx/model_fp16, model_int8, model_q4 and related files are not pinned)"
    - "Flash Attention 2 and the unpadded attention path"
    - "streaming"
    - "training and fine-tuning"
    - "Microsoft.Extensions.AI and ML.NET adapters"
    - "sigmoid-normalized scores (apply a sigmoid yourself; sentence-transformers applies one by default)"

processing:
  tokenizer:
    # The owned tokenizer pinned in ai-dotnet/Directory.Packages.props; ONNX Runtime receives ids only.
    package: Starlings.Tokenizers
    version: 0.3.5
    profile_id: modernbert-bpe-gte-reranker
    algorithm: bpe
    assets:
      - path: tokenizer.json
        sha256: "2aea6ff4701d063e7e029b6be695a1659f2caaa2ae4fb0e8b18285818271becd"
        size: 3583499
    backend_tokenizer_dependency: false

execution:
  backend:
    name: onnxruntime
    version: 1.30.0
    binding: Microsoft.ML.OnnxRuntime
  precision: fp32
  variant: reference
  graph:
    # BertModelProfile.RuntimeLock: this graph and tokenizer.json at the pinned revision.
    assets:
      - path: onnx/model.onnx
        sha256: "c6d3226502addbcd4d2cf273802957ebf8a2a6bf94037dcb9b1d95bfc01e5d93"
        size: 598803940
    hosting:
      # The upstream repository; the digests, not the address, pin the bytes.
      repository: https://huggingface.co/Alibaba-NLP/gte-reranker-modernbert-base
      revision: "f7481e6055501a30fb19d090657df9ec1f79ab2c"
      source_base: https://huggingface.co/Alibaba-NLP/gte-reranker-modernbert-base/resolve/f7481e6055501a30fb19d090657df9ec1f79ab2c/
      source_status: public
      produced_by:
        - upstream export (TorchScript ONNX exporter, PyTorch 2.5.1, opset 14, fp32)
    inputs:
      - { name: input_ids, type: int64, shape: [batch, sequence] }
      - { name: attention_mask, type: int64, shape: [batch, sequence] }
    outputs:
      - { name: logits, type: float32, shape: [batch, 1] }

capabilities:
  # Starlings.Models.Bert (BertCapabilities). Experimental where the onboarding route compared the C# package with the
  # framework reference on the proposed corpus (no adopted reference, no gate); unsupported where the package does not
  # offer it; untested where no evidence exists.
  batch: experimental
  streaming: unsupported
  cancellation: experimental  # between batch chunks and at ONNX Runtime graph-node boundaries
  persistence: unsupported
  training: unsupported
  aot: untested
  extensions_ai: unsupported
  mlnet: unsupported
  text: experimental
  batch_token_budget: experimental  # maxBatchTokens, off by default
  batch_sort_by_length: experimental  # sortByLength, off by default
  token_limit: experimental  # BertReranker.Create maxTokens, off by default; truncates text, refuses longer pre-tokenized rows
  asset_verification_offline: experimental
  built_in_profile: experimental  # BertModelProfile.BuiltIn("gte-reranker-modernbert-base")
  gpu: unsupported

compatibility:
  # Linux x64 CPU: development evidence from the onboarding route (#101). No gate.
  - os: linux
    arch: x64
    provider: cpu
    status: experimental
  - os: windows
    arch: x64
    provider: cpu
    status: untested

qualification:
  reference_runner: model-pipeline/reference/bert/run_bert.py
  # No protected fixtures exist for this profile: the proposed corpus the recipe runs (recipes/gte-reranker-modernbert-base-cpu.yaml).
  fixtures: model-pipeline/corpora/gte-reranker-modernbert-base/reranking.jsonl
  # No protected tolerances: the predeclared candidate policy (evaluation.policy, status proposed). Adoption into
  # protected/ is a separate change.
  tolerances: model-pipeline/candidates/gte-reranker-modernbert-base/profile.json
  gates:
    G0: { status: not-run }
    G1: { status: not-run }
    G2: { status: not-run }
    G3: { status: not-run }
    G4: { status: not-run }
    G5: { status: not-run }
    G6: { status: not-run }
    G7: { status: not-run }

maintenance:
  owner: Mark
  latest_verified_upstream_revision: "f7481e6055501a30fb19d090657df9ec1f79ab2c"
  review_date: 2027-02-04
  known_issues:
    - >-
      The references are proposed, not adopted into protected/, and no gate has run; every capability is at most
      experimental.
    - >-
      Scores are raw logits, not calibrated probabilities.
    - >-
      Onboarding evidence stops at the longest corpus row (1,468 tokens); the 8192-token limit is not gate evidence. Long
      pairs are costly on CPU. In a Python probe at four threads with the default CPU arena, which the package also leaves
      on, ONNX Runtime took about a minute for one 8,192-token pair and peaked at 10 GB on the first run and 19 GB from the
      second run on. This was not measured on .NET (docs/evidence/gte-reranker-modernbert-onboarding-2026-11-04).
