# BERT route (Starlings.Models.Bert): sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 on ONNX Runtime 1.30.0, fp32 on the CPU provider. Candidate
# contract: model-pipeline/candidates/paraphrase-multilingual/profile.json (onboarding route bert-onnx-cpu-v1,
# recipes/paraphrase-multilingual-cpu.yaml), admitted to the route in #182 once Starlings.Tokenizers 0.3.5 could load its
# tokenizer; BertModelProfile.BuiltIn("paraphrase-multilingual") embeds the same file. Experimental, like the other BERT
# profiles. No admission record exists for the BERT route; the references are proposed, not adopted into protected/, and
# no gate has run.
schema_version: 1
id: paraphrase-multilingual-minilm-l12-v2/onnx-fp32-cpu
# Experimental: development parity on the onboarding route only (proposed references, predeclared candidate policy); no gate ran.
maturity: experimental

origin:
  code:
    # No separate inference code is pinned: the C# package reimplements the pipeline (tokenization, pooling,
    # normalization) from this repository's configuration at the same commit.
