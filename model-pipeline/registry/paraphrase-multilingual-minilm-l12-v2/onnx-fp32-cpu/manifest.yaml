    revision: "e8f8c211226b894fcb81acc59f3b34ba3efd5f42"
  weights:
    url: https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    revision: "e8f8c211226b894fcb81acc59f3b34ba3efd5f42"
  files:
    # sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 at the pinned commit (candidates/paraphrase-multilingual/profile.json, origin.files), verified on download.
    - path: 1_Pooling/config.json
      sha256: "4be450dde3b0273bb9787637cfbd28fe04a7ba6ab9d36ac48e92b11e350ffc23"
      size: 190
