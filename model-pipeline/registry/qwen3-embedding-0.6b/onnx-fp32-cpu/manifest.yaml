    # Starling's export scripts (model-pipeline/reference/qwen3-embedding/, export_qwen3_onnx.py then
    # release_qwen3_onnx.py) at main when the graph was released: upstream ships PyTorch weights only. The hosted
    # NOTICE and README text comes from the change that added this manifest, not from this revision.
    url: https://github.com/starlinghq/starling
    revision: "c231221ae1582243d6d9108bd401e6f602e737cb"
  weights:
    url: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B
    revision: "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
  files:
    # Qwen3EmbeddingProfile.Embedding06B.RuntimeLock: Starlinghq/qwen3-embedding-0.6b-onnx at the pinned commit, the
    # export plus the original files of Qwen/Qwen3-Embedding-0.6B at 97b0c614 unchanged.
    - path: config.json
      sha256: "b5bf1f51fc45be473a54718cef92448d90a1be001bf9b9a44b8c7f10a19feaa9"
      size: 727
    - path: config_sentence_transformers.json
      sha256: "10667c72ddb772627bf1780cb7f86af8e2ae0032b8c243c731172064105c6961"
      size: 215
    - path: model.onnx
      sha256: "de6805d74481fefc313ea470de3877f64fe4093c99ce9d1172a026128d90d864"
      size: 337132
    - path: model.onnx.data
      sha256: "7c7569e58783ee0ad8c5fb797d7944aa4f5928af53fb4c1f626f71885af22969"
      size: 2383077376
    - path: tokenizer.json
      sha256: "def76fb086971c7867b829c23a26261e38d9d74e02139253b38aeb9df8b4b50a"
      size: 11423705
    - path: tokenizer_config.json
      sha256: "253153d0738ceb4c668d2eff957714dd2bea0b56de772a9fdccd96cbf517e6a0"
      size: 9706
  attribution: >-
    Qwen3-Embedding-0.6B by the Qwen team, Alibaba Cloud (Qwen/Qwen3-Embedding-0.6B, Apache-2.0). fp32 ONNX export by
