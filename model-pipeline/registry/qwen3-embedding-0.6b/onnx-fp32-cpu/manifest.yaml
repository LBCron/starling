  reference_runner: model-pipeline/reference/qwen3-embedding/run_qwen3_reference.py
  # No protected fixtures exist for this profile: the proposed corpus the recipe runs (recipes/qwen3-embedding-0.6b-cpu.yaml).
  fixtures: model-pipeline/reference/corpus/tokenizer-corpus-v1.jsonl
  # No protected tolerances: the predeclared candidate policy (evaluation.policy, status proposed). Adoption into
  # protected/ is a separate change.
  tolerances: model-pipeline/candidates/qwen3-embedding-0.6b/profile.json
  gates:
    G0: { status: not-run }
    G1: { status: not-run }
    G2: { status: not-run }
    G3: { status: not-run }
    G4: { status: not-run }
    G5: { status: not-run }
    G6: { status: not-run }
    G7: { status: not-run }

maintenance:
  latest_known_upstream_revision: "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
  latest_verified_upstream_revision: "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
  last_checked: 2026-11-02
  review_date: 2027-02-02
  known_issues:
    - >-
      The references are proposed, not adopted into protected/, and no gate has run; every capability is at most
      experimental.
    - >-
      The graph uses eager attention: memory grows with the square of the input length (about 4.3 GB of attention
      scores per layer for one 8,192-token row). The longest evaluated input has 6,572 tokens.
    - >-
      ITextEmbedder and Qwen3EmbeddingGenerator embed text as given (prompt none); queries need the query prompt or
      Qwen3TextEmbedder.FormatQuery for full retrieval quality.
