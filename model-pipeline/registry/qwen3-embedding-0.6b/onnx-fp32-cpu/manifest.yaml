rights:
  code_license: MIT OR Apache-2.0
  weights_license: Apache-2.0
  tokenizer_terms: Apache-2.0
  redistribution: download
  notes: >-
    Weights and tokenizer: Apache-2.0 (license: apache-2.0 in the model card front matter of Qwen/Qwen3-Embedding-0.6B
    at 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3). The hosting repository carries the Apache License 2.0 and a NOTICE
    stating the modifications (model-pipeline/reference/qwen3-embedding/NOTICE-qwen3-embedding-onnx.txt). Nothing is
    bundled in the package: the application downloads the pinned files explicitly
    (Qwen3EmbeddingModelAssets.DownloadAsync) from the public repository Starlinghq/qwen3-embedding-0.6b-onnx, verified
    by size and SHA-256.

behavior:
  tasks: [embedding]
  # Including the prompt and the appended <|endoftext|> (Qwen3EmbeddingProfile.DefaultMaxTokens).
  max_input_tokens: 8192
  offsets_unit: none
  # Right truncation that keeps the appended <|endoftext|>.
  truncation: truncate-right
  defaults:
    pooling: last token (the hidden state at sum(attention_mask) - 1, the appended <|endoftext|>)
    normalize: l2
    dimension: 1024
    prompts: "none = ''; document = ''; query = 'Instruct: Given a web search query, retrieve relevant passages that answer the query\\nQuery:' (no trailing space); never applied implicitly"
    batching: right padding with <|endoftext|> and mask 0, MaxBatchSize rows per call (default 8), MaxBatchTokens padded cells (default 8192)
    threads: Qwen3EmbeddingOptions.Threads intra-op (default 4)
  unsupported:
    - "GPU execution providers (CUDA, DirectML, CoreML)"
    - "fp16, bf16 and quantized graphs"
    - "Matryoshka (MRL) dimensions below 1024 (rejected)"
    - "the 4B and 8B checkpoints"
    - "inputs longer than 8192 tokens without truncation"
    - "streaming"
    - "training and fine-tuning"
    - "ML.NET adapter"

processing:
  tokenizer:
    # The owned tokenizer pinned in ai-dotnet/Directory.Packages.props; ONNX Runtime receives ids only.
    package: Starlings.Tokenizers
    version: 0.3.5
    # Byte-level BPE with the Sequence[ByteLevel, TemplateProcessing] post-processor that appends <|endoftext|>.
    profile_id: qwen3-bpe-embedding
    algorithm: byte-level-bpe
    assets:
      - path: tokenizer.json
        sha256: "def76fb086971c7867b829c23a26261e38d9d74e02139253b38aeb9df8b4b50a"
        size: 11423705
    backend_tokenizer_dependency: false

execution:
  backend:
    name: onnxruntime
    version: 1.30.0
    binding: Microsoft.ML.OnnxRuntime
  precision: fp32
  variant: reference
  graph:
    # Qwen3EmbeddingProfile.Embedding06B.RuntimeLock: these graph files and the upstream files above.
    assets:
      - path: model.onnx
        sha256: "de6805d74481fefc313ea470de3877f64fe4093c99ce9d1172a026128d90d864"
        size: 337132
      - path: model.onnx.data
        sha256: "7c7569e58783ee0ad8c5fb797d7944aa4f5928af53fb4c1f626f71885af22969"
        size: 2383077376
    hosting:
      # Public repository; the digests, not the address, pin the bytes. The export recipe reproduces them byte for byte.
      repository: https://huggingface.co/Starlinghq/qwen3-embedding-0.6b-onnx
      revision: "0585005027acc7232133808914cd8bc2a4bd1ea8"
      source_base: https://huggingface.co/Starlinghq/qwen3-embedding-0.6b-onnx/resolve/0585005027acc7232133808914cd8bc2a4bd1ea8/
      source_status: public
      produced_by:
        - model-pipeline/reference/qwen3-embedding/export_qwen3_onnx.py (PyTorch dynamo exporter, opset 20, fp32)
        - model-pipeline/reference/qwen3-embedding/release_qwen3_onnx.py (metadata stripped, one external data file)
    inputs:
      - { name: input_ids, type: int64, shape: [batch, sequence] }
      - { name: attention_mask, type: int64, shape: [batch, sequence] }
    outputs:
      - { name: last_hidden_state, type: float32, shape: [batch, sequence, 1024] }

capabilities:
  # Starlings.Models.Qwen3Embedding (Qwen3EmbeddingCapabilities). Experimental where the onboarding route compared the C#
  # package with the PyTorch reference (no adopted reference, no gate); unsupported where the package does not offer it;
  # untested where no evidence exists.
  batch: experimental
  streaming: unsupported
  cancellation: experimental  # between batch chunks
  persistence: unsupported
  training: unsupported
  aot: untested
  extensions_ai: experimental  # Starlings.Models.Qwen3Embedding.Extensions.AI (Qwen3EmbeddingGenerator)
  mlnet: unsupported
  text: experimental
  prompts: experimental
  long_input: experimental  # evidence up to 6,572 tokens; untested from there to 8,192 (max_input_tokens)
  # Qwen3EmbeddingModelAssets.DownloadAsync from the public hosting repository. Evidence: lock match and HEAD checks;
  # no end-to-end download recorded yet.
  asset_acquisition: experimental
  built_in_profile: experimental  # Qwen3EmbeddingProfile.Embedding06B
  matryoshka_dimensions: unsupported
  gpu: unsupported

compatibility:
  # Linux x64 CPU: development evidence from the onboarding route on 2026-11-02. No gate.
  - os: linux
    arch: x64
    provider: cpu
    status: experimental
    verified: 2026-11-02
  - os: windows
    arch: x64
    provider: cpu
    status: untested
  - os: linux
    arch: x64
    provider: cuda
    status: unsupported

