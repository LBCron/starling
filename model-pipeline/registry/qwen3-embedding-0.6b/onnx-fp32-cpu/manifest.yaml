# Qwen3 Embedding series (Starlings.Models.Qwen3Embedding, design #144, model request #108): Qwen/Qwen3-Embedding-0.6B
# through Starling's fp32 ONNX export (hosted at Starlinghq/qwen3-embedding-0.6b-onnx) on ONNX Runtime 1.30.0, CPU
# provider. Admission: model-pipeline/admissions/qwen3-embedding.md (Experimental, 2026-11-02). Candidate contract:
# model-pipeline/candidates/qwen3-embedding-0.6b/profile.json (onboarding route qwen3-embedding-onnx-cpu-v1,
# recipes/qwen3-embedding-0.6b-cpu.yaml). Development evidence: docs/evidence/qwen3-embedding-onboarding-2026-11-02/
# (558 checks passed). References are proposed, nothing is adopted into protected/, and no gate has run.
schema_version: 1
id: qwen3-embedding-0.6b/onnx-fp32-cpu
# Experimental: development parity on the onboarding route only (proposed references, predeclared candidate policy); no gate ran.
maturity: experimental

origin:
